name: Daily EPG Merge (India + Australia)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge-epg:
    runs-on: ubuntu-latest

    # Grant write permission to the GITHUB_TOKEN
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XMLTV tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmltv

      - name: Download and merge EPG sources
        run: |
          echo "Downloading India EPG..."
          curl -L -o india.xml.gz "https://www.open-epg.com/files/india.xml.gz"
          
          echo "Downloading Australia EPG..."
          curl -L -o australia.xml.gz "https://www.open-epg.com/files/australia.xml.gz"
          
          echo "Uncompressing files..."
          gunzip -f india.xml.gz australia.xml.gz
          
          echo "Merging EPG files..."
          tv_cat india.xml australia.xml > merged.xml
          
          echo "Compressing merged file..."
          gzip -9 -c merged.xml > merged.xml.gz
          
          echo "Cleanup..."
          rm -f india.xml australia.xml merged.xml

      - name: Commit and push merged EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f merged.xml.gz ]; then
            git add merged.xml.gz
            git commit -m "Auto-update merged EPG - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
            git push
          else
            echo "❌ Merged file not created!"
            exit 1
          fi
