name: Daily EPG Merge - Multiple Countries

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6      # ← Updated to v6 (Node 24)
        with:
          fetch-depth: 0

      - name: Install XMLTV tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmltv

      - name: Download and Merge EPGs
        run: |
          # ================== ADD NEW COUNTRIES HERE ==================
          declare -A epgs
          epgs["india"]="https://www.open-epg.com/files/india.xml.gz"
          epgs["australia"]="https://www.open-epg.com/files/australia.xml.gz"
          # epgs["usa"]="https://www.open-epg.com/files/usa.xml.gz"
          epgs["uk"]="https://www.open-epg.com/files/unitedkingdom.xml.gz"
          # epgs["germany"]="https://www.open-epg.com/files/germany.xml.gz"
          # ============================================================

          echo "Downloading EPG files..."
          for country in "${!epgs[@]}"; do
            url="${epgs[$country]}"
            echo "→ Downloading $country EPG..."
            curl -L -o "$country.xml.gz" "$url"
            gunzip -f "$country.xml.gz"
          done

          echo "Merging all EPG files..."
          tv_cat *.xml > merged.xml

          echo "Compressing merged file..."
          gzip -9 -c merged.xml > merged.xml.gz

          echo "Cleanup..."
          rm -f *.xml

      - name: Commit and push merged EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -f merged.xml.gz ]; then
            git add merged.xml.gz
            git commit -m "Auto-update merged EPG - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
            git push
          else
            echo "❌ Merged file not created!"
            exit 1
          fi
