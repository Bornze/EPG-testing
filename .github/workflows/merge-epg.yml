name: Update Custom EPG

on:
  schedule:
    - cron: '0 3 * * *'   # Runs daily at 3:00 AM UTC
  workflow_dispatch:       # Allows manual run

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EPG
        run: |
          echo "Downloading EPG from Open-EPG..."
          curl -L -o epg.xml.gz "https://www.open-epg.com/generate/bdBT3ZTDrk.xml.gz"
          
          # Optional: verify the file is valid
          if [ ! -f epg.xml.gz ]; then
            echo "❌ Download failed!"
            exit 1
          fi
          
          echo "✅ Download successful"
          ls -lh epg.xml.gz

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add epg.xml.gz
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update EPG - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
