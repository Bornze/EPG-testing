name: Daily EPG Merge - Multiple Countries

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install XMLTV tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmltv

      - name: Download and Merge EPGs
        run: |
          # ================== COUNTRIES ==================
          declare -A epgs
          epgs["india"]="https://www.open-epg.com/files/india.xml.gz"
          epgs["australia"]="https://www.open-epg.com/files/australia.xml.gz"
          epgs["uk"]="https://www.open-epg.com/files/unitedkingdom.xml.gz"
          # Add more later:
          # epgs["usa"]="https://www.open-epg.com/files/usa.xml.gz"

          echo "=== Starting EPG Download & Merge ==="

          valid_files=()
          for country in "${!epgs[@]}"; do
            url="${epgs[$country]}"
            echo "→ Downloading $country..."
            
            if curl -L -f --retry 3 --retry-delay 10 -o "$country.xml.gz" "$url"; then
              echo "   Download OK, decompressing..."
              if gunzip -f "$country.xml.gz"; then
                if [ -s "$country.xml" ] && head -c 10 "$country.xml" | grep -q "<?xml"; then
                  echo "   ✅ Valid XML detected"
                  valid_files+=("$country.xml")
                else
                  echo "   ❌ Invalid or empty XML (skipping)"
                  rm -f "$country.xml"
                fi
              else
                echo "   ❌ Decompression failed"
              fi
            else
              echo "   ❌ Download failed"
            fi
          done

          if [ ${#valid_files[@]} -eq 0 ]; then
            echo "❌ No valid EPG files downloaded!"
            exit 1
          fi

          echo "Merging ${#valid_files[@]} valid file(s)..."
          tv_cat "${valid_files[@]}" > merged.xml

          echo "Compressing..."
          gzip -9 -c merged.xml > merged.xml.gz

          echo "✅ Success! Merged ${#valid_files[@]} sources"
          ls -lh merged.xml.gz
          rm -f *.xml
