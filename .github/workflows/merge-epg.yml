name: Daily EPG Merge - Multiple Countries (Deduplicated)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install XMLTV tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmltv

      - name: Download and Merge EPGs with Deduplication
        run: |
          declare -A epgs
          epgs["india"]="https://www.open-epg.com/files/india.xml.gz"
          epgs["australia"]="https://www.open-epg.com/files/australia.xml.gz"
          epgs["uk"]="https://www.open-epg.com/files/unitedkingdom.xml.gz"
          epgs["canada"]="https://www.open-epg.com/files/canada.xml.gz"
         # epgs["usa"]="https://www.open-epg.com/files/unitedstates3.xml.gz"

          echo "=== Downloading EPGs ==="
          valid_files=()
          for country in "${!epgs[@]}"; do
            url="${epgs[$country]}"
            echo "→ Downloading $country..."
            if curl -L -f --retry 3 -o "$country.xml.gz" "$url"; then
              gunzip -f "$country.xml.gz" 2>/dev/null || true
              if [ -s "$country.xml" ] && head -c 10 "$country.xml" | grep -q "<?xml"; then
                echo "   ✅ Valid"
                valid_files+=("$country.xml")
              else
                echo "   ❌ Invalid"
                rm -f "$country.xml"
              fi
            else
              echo "   ❌ Download failed"
            fi
          done

          if [ ${#valid_files[@]} -eq 0 ]; then
            echo "❌ No valid files!"
            exit 1
          fi

          echo "Merging ${#valid_files[@]} files with deduplication..."
          tv_cat "${valid_files[@]}" > merged.xml

          echo "Compressing..."
          gzip -9 -c merged.xml > merged.xml.gz

          echo "✅ Success! Merged ${#valid_files[@]} sources"
          ls -lh merged.xml.gz
          rm -f *.xml

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add merged.xml.gz
          git commit -m "Auto-update merged EPG - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git commit --allow-empty -m "Auto-update merged EPG - $(date -u +'%Y-%m-%d %H:%M UTC') [force]" || true
          git push
