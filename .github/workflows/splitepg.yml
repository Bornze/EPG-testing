name: Daily EPG Merge - All + INUKAU

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  merge-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install XMLTV tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xmltv

      - name: Download and Create Merges
        run: |
          # ================== ALL COUNTRIES ==================
          echo "=== Building FULL MERGE (All Countries) ==="
          declare -A allcountries
          allcountries["india"]="https://www.open-epg.com/files/india.xml.gz"
          allcountries["australia"]="https://www.open-epg.com/files/australia.xml.gz"
          allcountries["uk"]="https://www.open-epg.com/files/unitedkingdom.xml.gz"
          allcountries["canada"]="https://www.open-epg.com/files/canada.xml.gz"
          allcountries["usa"]="https://www.open-epg.com/files/unitedstates3.xml.gz"
          allcountries["NewzeaLand"]="https://www.open-epg.com/files/newzealand1.xml.gz"
          
          valid_all=()
          for c in "${!allcountries[@]}"; do
            curl -L -f --retry 3 -o "$c.xml.gz" "${allcountries[$c]}"
            gunzip -f "$c.xml.gz" 2>/dev/null || true
            if [ -s "$c.xml" ] && head -c 10 "$c.xml" | grep -q "<?xml"; then
              valid_all+=("$c.xml")
            else
              rm -f "$c.xml"
            fi
          done

          if [ ${#valid_all[@]} -gt 0 ]; then
            tv_cat "${valid_all[@]}" > merged-all.xml
            gzip -9 -c merged-all.xml > merged-all.xml.gz
          fi

          # ================== ONLY IN + UK + AU ==================
          echo "=== Building INUKAU Group ==="
          declare -A inukau
          inukau["india"]="https://www.open-epg.com/files/india.xml.gz"
          inukau["uk"]="https://www.open-epg.com/files/unitedkingdom.xml.gz"
          inukau["australia"]="https://www.open-epg.com/files/australia.xml.gz"

          valid_inukau=()
          for c in "${!inukau[@]}"; do
            curl -L -f --retry 3 -o "$c.xml.gz" "${inukau[$c]}"
            gunzip -f "$c.xml.gz" 2>/dev/null || true
            if [ -s "$c.xml" ] && head -c 10 "$c.xml" | grep -q "<?xml"; then
              valid_inukau+=("$c.xml")
            else
              rm -f "$c.xml"
            fi
          done

          if [ ${#valid_inukau[@]} -gt 0 ]; then
            tv_cat "${valid_inukau[@]}" > merged-inukau.xml
            gzip -9 -c merged-inukau.xml > merged-inukau.xml.gz
          fi

          rm -f *.xml

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add merged-*.xml.gz
          git commit -m "Auto-update EPG files - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git commit --allow-empty -m "Auto-update EPG files - $(date -u +'%Y-%m-%d %H:%M UTC') [force]" || true
          git push
