name: Update Filtered EPG

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '30 12 * * *'  # 6:00 PM IST
    - cron: '30 15 * * *'  # 9:00 PM IST
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Source EPG
        run: |
          echo "Downloading source EPG..."
          curl -L --fail -A "Mozilla/5.0" \
            -o source_epg.xml.gz \
            "https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz"

          ls -lh source_epg.xml.gz
          file source_epg.xml.gz

      - name: Run Filter Script
        run: python filter_epg.py

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add filtered_epg.xml.gz || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update filtered EPG - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
